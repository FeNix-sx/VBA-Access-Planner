# Справочник: русские подписи окна свойств MS Access → имена свойств/событий в VBA.
# Версия интерфейса: русская локаль Office (подписи могут слегка отличаться по версии).
# Дополняйте объекты по мере появления скриншотов вкладок «Данные» и полного списка «События».

meta:
  title: Access — свойства и события (RU → EN)
  format: yaml
  notes:
    - Вкладка «Все» — объединение Макет + Данные + События + Другие; отдельного набора свойств нет.
    - Для элементов без привязки к данным вкладка «Данные» часто пустая или минимальная.
    - Свойства `en` взяты из VBA/объектной модели; `ru` — по возможности сверено со скринами RU Office (см. verified_from_user_screen в объектах).
    - На флажке в окне свойств строки «Отступ …» у вас соответствуют полям VBA Margin (TopMargin и т.д.) — на других элементах те же слова могут означать Padding; ориентируйтесь на столбец en.
    - Объекты «Форма» и разделы выбираются щелчком по серой полоске раздела / пустому месту формы в конструкторе; в VBA объект раздела — Section.Parent = Form.

section_tabs:
  format: { ru: Макет, en: Format }
  data: { ru: Данные, en: Data }
  event: { ru: События, en: Event }
  other: { ru: Другие, en: Other }
  all: { ru: Все, en: All }

# Если в вашем Access подпись другая — пришлите скрин только указанной вкладки (не всего окна свойств).
needs_screenshot_if_ru_mismatch:
  - { object_ru: Поле, section: Данные, hint: Если подпись у ControlSource не «Источник элемента управления» — пришлите скрин. }
  - { object_ru: Поле со списком, section: Данные, hint: Источник строк, тип источника, ограничение списком, разрешить правки списка значений. }
  - { object_ru: Кнопка, section: Макет, hint: Цвета наведения/нажатия, тема, указатель при наведении — если версия Office без этих строк. }
  - { object_ru: любой, section: Макет, hint: Редкие свойства IME, смарт-теги, специфичные для версии. }
  - { object_ru: Форма / разделы формы, section: любая, hint: Много строк и синонимов (Режим по умолчанию, Источник записей); при споре — скрин окна свойств. }

